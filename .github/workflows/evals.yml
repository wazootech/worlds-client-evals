name: Agent evals

permissions:
  contents: read
  discussions: write

env:
  EVAL_DISCUSSION_CATEGORY: Eval reports

on:
  schedule:
    # Weekly baseline (Monday 06:00 UTC). Skips when the harness was idle for 7+ days.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      filter:
        description: Eval case filter (Deno-test-like pattern)
        required: false
        default: ""
      trials:
        description: Trials per case (statistical mode)
        required: false
        default: "10"
      min_pass_rate:
        description: Minimum per-case pass rate when trials > 1 (0-1)
        required: false
        default: "0.8"

jobs:
  check-activity:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.activity.outputs.should_run }}
      skip_reason: ${{ steps.activity.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether scheduled evals should run
        id: activity
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "Manual workflow_dispatch — running evals regardless of recent commits."
            exit 0
          fi

          # Harness-relevant paths only.
          HARNESS_PATHS=(
            "src/"
            "tests/"
            "scripts/"
            "deno.json"
            "deno.lock"
            ".github/workflows/"
            "vendor/"
          )

          RECENT_COMMITS=$(
            git log --since="7 days ago" --format=%H -- "${HARNESS_PATHS[@]}" | wc -l | tr -d ' '
          )

          if [ "$RECENT_COMMITS" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "Found ${RECENT_COMMITS} harness commit(s) in the last 7 days — running evals."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no_harness_commits_7d" >> "$GITHUB_OUTPUT"
            echo "No harness commits in the last 7 days — skipping scheduled evals."
          fi

  evals:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run credentialed agent evals
        id: eval
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          if [ -z "$GOOGLE_GENERATIVE_AI_API_KEY" ]; then
            echo "GOOGLE_GENERATIVE_AI_API_KEY secret is not configured; skipping live evals."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "api_key_configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "api_key_configured=true" >> "$GITHUB_OUTPUT"

          TRIALS="${{ github.event.inputs.trials }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TRIALS="10"
          fi
          if [ -z "$TRIALS" ]; then
            TRIALS="10"
          fi
          MIN_PASS_RATE="${{ github.event.inputs.min_pass_rate }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MIN_PASS_RATE="0.8"
          fi
          ARGS=(--trials "$TRIALS")
          if [ -n "${{ github.event.inputs.filter }}" ]; then
            ARGS+=(--filter "${{ github.event.inputs.filter }}")
          fi
          if [ -n "$MIN_PASS_RATE" ]; then
            ARGS+=(--min-pass-rate "$MIN_PASS_RATE")
          fi

          set +e
          deno run -A --env ./src/cli/run.ts "${ARGS[@]}"
          EXIT_CODE=$?
          set -e
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "::error::Eval run aborted due to fatal API error (billing/quota/auth). Check GOOGLE_GENERATIVE_AI_API_KEY secret and Google AI Studio billing status."
            exit 2
          fi

      - name: Upload eval results artifact
        id: upload_results
        if: steps.eval.outputs.api_key_configured == 'true' && steps.eval.outputs.exit_code != '2'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: results/*.json
          if-no-files-found: error

      - name: Publish eval report discussion
        if: steps.eval.outputs.api_key_configured == 'true' && steps.eval.outputs.exit_code != '2'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: eval-results-${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload_results.outputs.artifact-url }}
          EXIT_CODE: ${{ steps.eval.outputs.exit_code }}
          FILTER: ${{ github.event.inputs.filter }}
          MIN_PASS_RATE: ${{ github.event.inputs.min_pass_rate }}
          TRIALS: ${{ github.event.inputs.trials }}
        run: |
          REPOSITORY_OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA::7}"
          STATUS="pass"
          if [ "$EXIT_CODE" = "1" ]; then
            STATUS="fail"
          fi

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            TRIALS="10"
            MIN_PASS_RATE="0.8"
          fi
          if [ -z "$TRIALS" ]; then
            TRIALS="10"
          fi
          if [ -z "$FILTER" ]; then
            FILTER="full suite"
          fi
          if [ -z "$MIN_PASS_RATE" ]; then
            MIN_PASS_RATE="not set"
          fi

          CATEGORY_ID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { discussionCategories(first: 50) { nodes { id name } } } }' \
            -F owner="$REPOSITORY_OWNER" \
            -F name="$REPOSITORY_NAME" \
            --jq '.data.repository.discussionCategories.nodes[] | select(.name == "'"$EVAL_DISCUSSION_CATEGORY"'") | .id')

          if [ -z "$CATEGORY_ID" ]; then
            echo "::warning::GitHub Discussions category '${EVAL_DISCUSSION_CATEGORY}' was not found; skipping eval report discussion."
            exit 0
          fi

          REPOSITORY_ID=$(gh api graphql \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }' \
            -F owner="$REPOSITORY_OWNER" \
            -F name="$REPOSITORY_NAME" \
            --jq '.data.repository.id')

          TITLE="Agent evals: ${STATUS} for ${SHORT_SHA} (${GITHUB_RUN_ID})"
          BODY=$(cat <<EOF
          ## Eval report

          | Field | Value |
          | :---- | :---- |
          | Status | ${STATUS} |
          | Trigger | ${GITHUB_EVENT_NAME} |
          | Commit | ${GITHUB_SHA} |
          | Filter | ${FILTER} |
          | Trials | ${TRIALS} |
          | Minimum pass rate | ${MIN_PASS_RATE} |
          | Workflow run | ${WORKFLOW_URL} |
          | Artifact | [${ARTIFACT_NAME}](${ARTIFACT_URL}) |

          Assertions and pass-rate gates determine harness health. Generated trajectories are uploaded as workflow artifacts and are not committed to this repository.
          EOF
          )

          gh api graphql \
            -f query='mutation($repositoryId: ID!, $categoryId: ID!, $title: String!, $body: String!) { createDiscussion(input: { repositoryId: $repositoryId, categoryId: $categoryId, title: $title, body: $body }) { discussion { url } } }' \
            -F repositoryId="$REPOSITORY_ID" \
            -F categoryId="$CATEGORY_ID" \
            -F title="$TITLE" \
            -F body="$BODY" \
            --jq '.data.createDiscussion.discussion.url'

      - name: Summarize eval results
        if: steps.eval.outputs.api_key_configured == 'true' && steps.eval.outputs.exit_code != '2'
        run: |
          {
            echo "## Eval results"
            echo ""
            echo "Uploaded the latest eval JSON files as the \`eval-results-${{ github.run_id }}\` workflow artifact."
            echo "Published a best-effort GitHub Discussion in the \`${EVAL_DISCUSSION_CATEGORY}\` category when that category exists."
            echo "Assertions and pass-rate gates determine harness health; generated trajectories are not committed to this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job when eval assertions did not pass
        if: steps.eval.outputs.api_key_configured == 'true' && steps.eval.outputs.exit_code == '1'
        run: |
          echo "Eval assertions or pass-rate gate failed; see workflow logs and uploaded eval results."
          exit 1

  skipped:
    needs: check-activity
    if: needs.check-activity.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skip
        run: |
          echo "Scheduled agent evals skipped (${{ needs.check-activity.outputs.skip_reason }})."
          echo "No harness changes in the last 7 days; use workflow_dispatch to run anyway."
